# LibreChat configuration
# Docs: https://www.librechat.ai/docs/configuration/librechat_yaml
version: 1.3.16
cache: true

# El disco de Railway es efímero: cada deploy levanta un contenedor limpio y se
# lleva todo lo que generaron los agentes. Con `local`, una imagen creada antes
# del último deploy ya no existe, y pasársela a la tool de video falla con
# ENOENT.
#
# Descomentar SOLO cuando el bucket y las credenciales estén cargadas en
# Railway (AWS_ENDPOINT_URL, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY,
# AWS_REGION, AWS_BUCKET_NAME, y AWS_FORCE_PATH_STYLE en proveedores
# path-style como R2 o MinIO). Activarlo sin credenciales rompe el guardado de
# archivos por completo, que es peor que perderlos en cada deploy.
# fileStrategy: s3

# Solo estos dominios pueden REGISTRARSE (y usar "olvidé mi contraseña"
# y login social). El login local de cuentas ya existentes no se filtra.
registration:
  allowedDomains:
    - 'publicismpetu.com.uy'
    - 'publicisgroupe.com.uy'

# `modelSelect: false` oculta el listado crudo, pero también vacía la lista de
# endpoints entera (`useEndpoints.ts:96` corta antes de mirar `addedEndpoints`),
# y con ella desaparecen los Agentes del selector. Queda en true para que sean
# alcanzables; lo que mantiene el menú corto es podar los modelos de cada
# proveedor. `presets` y `parameters` siguen en false porque un preset o un
# parámetro guardado puede pisar lo que define una spec.
interface:
  modelSelect: true
  parameters: false
  presets: false
  agents: true

endpoints:
  google:
    titleConvo: true
    titleModel: 'gemini-2.5-flash-lite'
    streamRate: 25

  custom:
    # Solo los modelos de conversación. Los `grok-imagine-*` de imagen y video
    # quedan fuera a propósito: LibreChat no tiene herramienta que los use, así
    # que elegirlos como modelo de chat falla.
    - name: 'xAI'
      apiKey: '${XAI_API_KEY}'
      baseURL: 'https://api.x.ai/v1'
      modelDisplayLabel: 'Grok'
      titleConvo: true
      titleMethod: 'completion'
      titleModel: 'grok-4.3'
      models:
        fetch: false
        default:
          - name: grok-4.5
            description: 'Razonamiento avanzado'
          - name: grok-4.3
            description: 'Uso general'

# Lista curada de modelos, al estilo de la app de Gemini: el nombre con versión
# arriba y, debajo, costo relativo más para qué sirve.
#
# La escala $/$$/$$$ va sobre el precio de SALIDA por 1M, que es el que domina
# en chat: $ hasta 4 dólares, $$ hasta 15, $$$ por encima. Si cambian las
# tarifas del proveedor hay que revisarla — no se calcula sola.
#
# `enforce` queda en false a propósito: con true, el servidor rechaza toda
# petición que no lleve un `spec` (`buildEndpointOption.js:99`), y un agente no
# lleva ninguno — seleccionarlo devolvía "No model spec selected" y la interfaz
# se quedaba muda. Quien oculta el listado crudo es `interface.modelSelect`.
#
# `softDefault` en vez de `default` por la misma razón: un `default` duro se
# impone antes de mirar la última selección (`utils/endpoints.ts:435`), así que
# pisaría el agente elegido al abrir un chat nuevo.
modelSpecs:
  enforce: false
  prioritize: true
  # Sin `addedEndpoints`: la lista no se restringe. Con `['agents']`, agents era
  # el único que podía pasar el filtro de `useEndpoints.ts`, así que cualquier
  # motivo para descartarlo dejaba el selector sin ningún endpoint — y sin los
  # agentes, que es lo que se buscaba conservar.
  list:
    - name: flash-lite
      label: 'Gemini 3.1 Flash-Lite'
      description: '$ · Respuestas rápidas y económicas'
      iconURL: google
      order: 1
      preset:
        endpoint: google
        model: gemini-3.1-flash-lite

    - name: flash
      label: 'Gemini 3.8 Flash'
      description: '$ · Asistencia general'
      iconURL: google
      order: 2
      softDefault: true
      preset:
        endpoint: google
        model: gemini-3.8-flash

    - name: pro
      label: 'Gemini 3.1 Pro'
      description: '$$ · Razonamiento avanzado'
      iconURL: google
      order: 3
      preset:
        endpoint: google
        model: gemini-3.1-pro-preview

    - name: claude-sonnet
      label: 'Claude Sonnet 5'
      description: '$$ · Redacción y análisis de textos largos'
      iconURL: anthropic
      order: 4
      preset:
        endpoint: anthropic
        model: claude-sonnet-5

    - name: claude-opus
      label: 'Claude Opus 5'
      description: '$$$ · Máxima capacidad para trabajo complejo'
      iconURL: anthropic
      order: 5
      preset:
        endpoint: anthropic
        model: claude-opus-5

    # `gpt-5.6` pelado no existe en la API: solo las variantes -luna, -sol y
    # -terra. `-sol` queda fuera porque no tiene tarifa propia — hereda la
    # genérica de `gpt-5.6` por coincidencia de prefijo, que puede no ser la suya.
    - name: gpt-rapido
      label: 'GPT 5.6 Luna'
      description: '$ · Tareas simples, el más económico'
      iconURL: openAI
      order: 6
      preset:
        endpoint: openAI
        model: gpt-5.6-luna

    - name: gpt
      label: 'GPT 5.6 Terra'
      description: '$$ · Uso general'
      iconURL: openAI
      order: 7
      preset:
        endpoint: openAI
        model: gpt-5.6-terra

    # $10/$50 por 1M: trece veces Gemini Flash en salida. La descripción avisa
    # del costo para que no sea la opción por reflejo.
    - name: gpt-maximo
      label: 'GPT 6 Astra'
      description: '$$$ · El más capaz, y el más caro del menú'
      iconURL: openAI
      order: 8
      preset:
        endpoint: openAI
        model: gpt-6-astra

    - name: grok
      label: 'Grok 4.5'
      description: '$$ · Segunda opinión, de otro proveedor'
      order: 9
      preset:
        endpoint: xAI
        model: grok-4.5
