# LibreChat configuration
# Docs: https://www.librechat.ai/docs/configuration/librechat_yaml
version: 1.3.16
cache: true

# Solo estos dominios pueden REGISTRARSE (y usar "olvidé mi contraseña"
# y login social). El login local de cuentas ya existentes no se filtra.
registration:
  allowedDomains:
    - 'publicismpetu.com.uy'
    - 'publicisgroupe.com.uy'

# `modelSelect: false` es lo que oculta el listado crudo de modelos; el menú
# curado de `modelSpecs` sigue visible. `presets` y `parameters` quedan en false
# porque un preset o un parámetro guardado puede pisar lo que define una spec.
interface:
  modelSelect: false
  parameters: false
  presets: false
  agents: true

endpoints:
  google:
    titleConvo: true
    titleModel: 'gemini-2.5-flash-lite'
    streamRate: 25

  custom:
    # Solo los modelos de conversación. Los `grok-imagine-*` de imagen y video
    # quedan fuera a propósito: LibreChat no tiene herramienta que los use, así
    # que elegirlos como modelo de chat falla.
    - name: 'xAI'
      apiKey: '${XAI_API_KEY}'
      baseURL: 'https://api.x.ai/v1'
      modelDisplayLabel: 'Grok'
      titleConvo: true
      titleMethod: 'completion'
      titleModel: 'grok-4.3'
      models:
        fetch: false
        default:
          - name: grok-4.5
            description: 'Razonamiento avanzado'
          - name: grok-4.3
            description: 'Uso general'

# Lista curada de modelos, al estilo de la app de Gemini: nombre corto y una
# línea de contexto en vez del identificador crudo del proveedor.
#
# `enforce` queda en false a propósito: con true, el servidor rechaza toda
# petición que no lleve un `spec` (`buildEndpointOption.js:99`), y un agente no
# lleva ninguno — seleccionarlo devolvía "No model spec selected" y la interfaz
# se quedaba muda. Quien oculta el listado crudo es `interface.modelSelect`.
#
# `softDefault` en vez de `default` por la misma razón: un `default` duro se
# impone antes de mirar la última selección (`utils/endpoints.ts:435`), así que
# pisaría el agente elegido al abrir un chat nuevo.
modelSpecs:
  enforce: false
  prioritize: true
  addedEndpoints:
    - agents
  list:
    - name: flash-lite
      label: 'Gemini Flash-Lite'
      description: 'gemini-3.1-flash-lite · Respuestas rápidas y económicas'
      iconURL: google
      order: 1
      preset:
        endpoint: google
        model: gemini-3.1-flash-lite

    - name: flash
      label: 'Gemini Flash'
      description: 'gemini-3.8-flash · Asistencia general'
      iconURL: google
      order: 2
      softDefault: true
      preset:
        endpoint: google
        model: gemini-3.8-flash

    - name: pro
      label: 'Gemini Pro'
      description: 'gemini-3.1-pro-preview · Razonamiento avanzado'
      iconURL: google
      order: 3
      preset:
        endpoint: google
        model: gemini-3.1-pro-preview

    - name: claude-sonnet
      label: 'Claude Sonnet'
      description: 'claude-sonnet-5 · Redacción y análisis de textos largos'
      iconURL: anthropic
      order: 4
      preset:
        endpoint: anthropic
        model: claude-sonnet-5

    - name: claude-opus
      label: 'Claude Opus'
      description: 'claude-opus-5 · Máxima capacidad para trabajo complejo'
      iconURL: anthropic
      order: 5
      preset:
        endpoint: anthropic
        model: claude-opus-5

    # `gpt-5.6` pelado no existe en la API: solo las variantes -luna, -sol y
    # -terra. `-sol` queda fuera porque no tiene tarifa propia — hereda la
    # genérica de `gpt-5.6` por coincidencia de prefijo, que puede no ser la suya.
    - name: gpt-rapido
      label: 'GPT Rápido'
      description: 'gpt-5.6-luna · Tareas simples, el más económico'
      iconURL: openAI
      order: 6
      preset:
        endpoint: openAI
        model: gpt-5.6-luna

    - name: gpt
      label: 'GPT'
      description: 'gpt-5.6-terra · Uso general'
      iconURL: openAI
      order: 7
      preset:
        endpoint: openAI
        model: gpt-5.6-terra

    # $10/$50 por 1M: trece veces Gemini Flash en salida. La descripción avisa
    # del costo para que no sea la opción por reflejo.
    - name: gpt-maximo
      label: 'GPT Máximo'
      description: 'gpt-6-astra · El más capaz de OpenAI, y el más caro'
      iconURL: openAI
      order: 8
      preset:
        endpoint: openAI
        model: gpt-6-astra

    - name: grok
      label: 'Grok'
      description: 'grok-4.5 · Segunda opinión, de otro proveedor'
      order: 9
      preset:
        endpoint: xAI
        model: grok-4.5
