# LibreChat configuration
# Docs: https://www.librechat.ai/docs/configuration/librechat_yaml
version: 1.3.16
cache: true

# Solo estos dominios pueden REGISTRARSE (y usar "olvidé mi contraseña"
# y login social). El login local de cuentas ya existentes no se filtra.
registration:
  allowedDomains:
    - 'publicismpetu.com.uy'
    - 'publicisgroupe.com.uy'

# Con `modelSpecs.enforce` activo, el arranque advierte que estas tres opciones
# compiten con el menú curado: `modelSelect` reabre el selector crudo, y un
# preset o un parámetro guardado puede pisar lo que define la spec.
interface:
  modelSelect: false
  parameters: false
  presets: false
  agents: true

endpoints:
  google:
    titleConvo: true
    titleModel: 'gemini-2.5-flash-lite'
    streamRate: 25

  custom:
    # Solo los modelos de conversación. Los `grok-imagine-*` de imagen y video
    # quedan fuera a propósito: LibreChat no tiene herramienta que los use, así
    # que elegirlos como modelo de chat falla.
    - name: 'xAI'
      apiKey: '${XAI_API_KEY}'
      baseURL: 'https://api.x.ai/v1'
      modelDisplayLabel: 'Grok'
      titleConvo: true
      titleMethod: 'completion'
      titleModel: 'grok-4.3'
      models:
        fetch: false
        default:
          - name: grok-4.5
            description: 'Razonamiento avanzado'
          - name: grok-4.3
            description: 'Uso general'

# Lista curada de modelos, al estilo de la app de Gemini: nombre corto y una
# línea de contexto en vez del identificador crudo del proveedor.
# `enforce: true` reemplaza la lista larga por esta; `addedEndpoints` mantiene
# los Agentes accesibles desde el mismo menú.
modelSpecs:
  enforce: true
  prioritize: true
  addedEndpoints:
    - agents
  list:
    - name: flash-lite
      label: 'Gemini Flash-Lite'
      description: 'Respuestas rápidas para tareas simples'
      iconURL: google
      order: 1
      preset:
        endpoint: google
        model: gemini-3.1-flash-lite

    - name: flash
      label: 'Gemini Flash'
      description: 'Asistencia general'
      iconURL: google
      order: 2
      default: true
      preset:
        endpoint: google
        model: gemini-3.8-flash

    - name: pro
      label: 'Gemini Pro'
      description: 'Razonamiento avanzado'
      iconURL: google
      order: 3
      preset:
        endpoint: google
        model: gemini-3.1-pro-preview

    - name: claude-sonnet
      label: 'Claude Sonnet'
      description: 'Redacción y análisis de textos largos'
      iconURL: anthropic
      order: 4
      preset:
        endpoint: anthropic
        model: claude-sonnet-5

    - name: claude-opus
      label: 'Claude Opus'
      description: 'Máxima capacidad para trabajo complejo'
      iconURL: anthropic
      order: 5
      preset:
        endpoint: anthropic
        model: claude-opus-5

    # Requiere una OPENAI_API_KEY real. Con `user_provided`, cada usuario
    # tiene que cargar la suya desde la interfaz.
    - name: gpt
      label: 'GPT'
      description: 'Alternativa de OpenAI'
      iconURL: openAI
      order: 6
      preset:
        endpoint: openAI
        model: gpt-5.6

    - name: grok
      label: 'Grok'
      description: 'Segunda opinión, de otro proveedor'
      order: 7
      preset:
        endpoint: xAI
        model: grok-4.5
